<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script>
    // This script will dynamically load the AR content based on the marker pattern
    AFRAME.registerComponent('ar-content-manager', {
      schema: {
        markerName: { type: 'string', default: '' },
        contentType: { type: 'string', default: 'model' }, // model, image, or video
        contentUrl: { type: 'string', default: '' }
      },
      
      init: function() {
        this.marker = this.el;
        
        // Set up event listeners
        this.marker.addEventListener('markerFound', this.onMarkerFound.bind(this));
        this.marker.addEventListener('markerLost', this.onMarkerLost.bind(this));
        
        // Create content element based on type
        this.createContentElement();
      },
      
      createContentElement: function() {
        const contentType = this.data.contentType;
        let contentEl;
        
        // Clean up any existing content
        const existingContent = this.marker.querySelector('.ar-content');
        if (existingContent) {
          this.marker.removeChild(existingContent);
        }
        
        // Create appropriate element based on content type
        if (contentType === 'model') {
          contentEl = document.createElement('a-entity');
          contentEl.setAttribute('gltf-model', this.data.contentUrl);
          contentEl.setAttribute('scale', '1 1 1');
          contentEl.setAttribute('position', '0 0.5 0');
          contentEl.setAttribute('rotation', '0 0 0');
        } 
        else if (contentType === 'image') {
          contentEl = document.createElement('a-image');
          contentEl.setAttribute('src', this.data.contentUrl);
          contentEl.setAttribute('position', '0 0.5 0');
          contentEl.setAttribute('rotation', '-90 0 0');
          contentEl.setAttribute('width', '1');
          contentEl.setAttribute('height', '1');
        } 
        else if (contentType === 'video') {
          // Create video element
          const videoEl = document.createElement('video');
          videoEl.setAttribute('id', `video-${this.data.markerName}`);
          videoEl.setAttribute('src', this.data.contentUrl);
          videoEl.setAttribute('autoplay', 'false');
          videoEl.setAttribute('loop', 'true');
          videoEl.setAttribute('muted', 'true');
          videoEl.setAttribute('playsinline', 'true');
          videoEl.setAttribute('crossorigin', 'anonymous');
          document.body.appendChild(videoEl);
          
          // Create a-video element
          contentEl = document.createElement('a-video');
          contentEl.setAttribute('src', `#video-${this.data.markerName}`);
          contentEl.setAttribute('position', '0 0.5 0');
          contentEl.setAttribute('rotation', '-90 0 0');
          contentEl.setAttribute('width', '1.6');
          contentEl.setAttribute('height', '0.9');
          
          // Store video element reference
          this.videoEl = videoEl;
        }
        
        // Add common properties
        contentEl.classList.add('ar-content');
        contentEl.setAttribute('visible', 'false');
        
        // Add to marker
        this.marker.appendChild(contentEl);
        this.contentEl = contentEl;
      },
      
      onMarkerFound: function() {
        console.log(`Marker found: ${this.data.markerName}`);
        
        // Show content
        if (this.contentEl) {
          this.contentEl.setAttribute('visible', 'true');
        }
        
        // Play video if content is video
        if (this.data.contentType === 'video' && this.videoEl) {
          this.videoEl.play().catch(error => {
            console.error('Error playing video:', error);
          });
        }
      },
      
      onMarkerLost: function() {
        console.log(`Marker lost: ${this.data.markerName}`);
        
        // Hide content
        if (this.contentEl) {
          this.contentEl.setAttribute('visible', 'false');
        }
        
        // Pause video if content is video
        if (this.data.contentType === 'video' && this.videoEl) {
          this.videoEl.pause();
        }
      }
    });
    
    // This function is called from the parent application to load marker data
    window.loadMarkerData = function(markerData) {
      const sceneEl = document.querySelector('a-scene');
      
      // Clear existing markers
      const existingMarkers = document.querySelectorAll('a-marker');
      existingMarkers.forEach(marker => {
        sceneEl.removeChild(marker);
      });
      
      // Add new markers based on marker data
      markerData.forEach(marker => {
        // Create marker element
        const markerEl = document.createElement('a-marker');
        markerEl.setAttribute('type', 'pattern');
        markerEl.setAttribute('url', marker.patternUrl);
        markerEl.setAttribute('emitevents', 'true');
        markerEl.setAttribute('ar-content-manager', {
          markerName: marker.name,
          contentType: marker.contentType,
          contentUrl: marker.contentUrl
        });
        
        // Add marker to scene
        sceneEl.appendChild(markerEl);
        
        console.log(`Added marker: ${marker.name} with content type: ${marker.contentType}`);
      });
    };
    
    // Communication with parent application for debugging
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'load-markers') {
        window.loadMarkerData(event.data.markers);
      }
    });
  </script>
  <style>
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .arjs-loader div {
      text-align: center;
      font-size: 1.25em;
      color: white;
    }
    
    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 16px;
      background-color: white;
      border-radius: 4px;
      font-weight: bold;
      z-index: 9999;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
    
    .info-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      padding: 10px 15px;
      font-family: Arial, sans-serif;
      z-index: 9999;
      display: none;
    }
    
    .info-panel.visible {
      display: block;
    }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">
  <!-- Loading screen -->
  <div class="arjs-loader">
    <div>
      <p>Loading AR Experience...</p>
      <p>Please allow camera access when prompted</p>
    </div>
  </div>
  
  <!-- Back button to return to main app -->
  <div class="back-button" onclick="window.history.back()">
    ← Back
  </div>
  
  <!-- Info panel at the bottom -->
  <div class="info-panel" id="infoPanel">
    <h3 id="markerName">No marker detected</h3>
    <p id="markerInfo"></p>
  </div>
  
  <!-- A-Frame Scene -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled: false"
  >
    <!-- Default camera -->
    <a-entity camera></a-entity>
    
    <!-- Markers will be added dynamically via JavaScript -->
  </a-scene>
  
  <script>
    // Remove loader when scene is loaded
    document.addEventListener('DOMContentLoaded', function() {
      const scene = document.querySelector('a-scene');
      scene.addEventListener('loaded', function() {
        const loader = document.querySelector('.arjs-loader');
        loader.style.display = 'none';
      });
    });
    
    // Update info panel when markers are found/lost
    AFRAME.registerComponent('marker-event-relay', {
      init: function() {
        const marker = this.el;
        const infoPanel = document.getElementById('infoPanel');
        const markerName = document.getElementById('markerName');
        const markerInfo = document.getElementById('markerInfo');
        
        marker.addEventListener('markerFound', function() {
          const name = marker.getAttribute('ar-content-manager').markerName;
          const contentType = marker.getAttribute('ar-content-manager').contentType;
          
          markerName.textContent = name;
          markerInfo.textContent = `Content type: ${contentType}`;
          infoPanel.classList.add('visible');
        });
        
        marker.addEventListener('markerLost', function() {
          markerName.textContent = 'No marker detected';
          markerInfo.textContent = 'Point your camera at a marker';
          infoPanel.classList.remove('visible');
        });
      }
    });
  </script>
</body>
</html>
